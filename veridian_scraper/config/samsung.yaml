# Samsung scraper configuration.
#
# This file is the source of truth for the Samsung base URL and for the region
# list (category paths, rate limit, timeout). CSS selectors live in the
# scraper code because the site changes them with every build.
#
# The Galaxy Book listing is published at /us/galaxybooks/. The older
# /us/computing/galaxy-book/ path only 302-redirects there, so the canonical
# path is configured here to avoid the extra hop.
manufacturer: "samsung"
brand: "Samsung"
base_url: "https://www.samsung.com/"
user_agent: "VeridianBot/1.0 (+https://veridian.dev; contact@veridian.dev)"
output_dir: "./output"
max_concurrent: 2
retry_attempts: 3
checkpoint_interval: 10

regions:
  - code: "us"
    name: "United States"
    base_url: "https://www.samsung.com/us/"
    language: "en"
    currency: "USD"
    category_paths:
      galaxy-book: "galaxybooks/"
    rate_limit: 0.5
    timeout: 30
