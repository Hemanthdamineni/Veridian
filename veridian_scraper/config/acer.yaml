# Acer scraper configuration.
#
# This file is the source of truth for the Acer base URL and for the region
# list (category paths, rate limit, timeout). CSS selectors live in the
# scraper code because the site changes them with every build.
manufacturer: "acer"
brand: "Acer"
base_url: "https://www.acer.com/"
user_agent: "VeridianBot/1.0 (+https://veridian.dev; contact@veridian.dev)"
output_dir: "./output"
max_concurrent: 2
retry_attempts: 3
checkpoint_interval: 10

regions:
  - code: "us"
    name: "United States"
    base_url: "https://www.acer.com/"
    language: "en"
    currency: "USD"
    category_paths:
      laptops: "/ac/en/US/content/laptops"
      desktops: "/ac/en/US/content/desktops"
      monitors: "/ac/en/US/content/monitors"
      tablets: "/ac/en/US/content/tablets"
    rate_limit: 0.5
    timeout: 30
