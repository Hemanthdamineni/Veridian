# ASUS scraper configuration.
#
# This file is the source of truth for the ASUS base URL and for the region
# list (category paths, rate limit, timeout). CSS selectors live in the
# scraper code because the site changes them with every build.
manufacturer: "asus"
brand: "ASUS"
base_url: "https://www.asus.com/"
user_agent: "VeridianBot/1.0 (+https://veridian.dev; contact@veridian.dev)"
output_dir: "./output"
max_concurrent: 2
retry_attempts: 3
checkpoint_interval: 10

regions:
  - code: "us"
    name: "United States"
    base_url: "https://www.asus.com/us/"
    language: "en"
    currency: "USD"
    category_paths:
      laptops: "laptops/"
      displays-desktops: "displays-desktops/"
      monitors: "monitors/"
      motherboards-components: "motherboards-components/"
      networking-iot-servers: "networking-iot-servers/"
      accessories: "accessories/"
    rate_limit: 0.5
    timeout: 30
  - code: "in"
    name: "India"
    base_url: "https://www.asus.com/in/"
    language: "en"
    currency: "INR"
    category_paths:
      laptops: "laptops/"
      displays-desktops: "displays-desktops/"
      monitors: "monitors/"
      motherboards-components: "motherboards-components/"
      networking-iot-servers: "networking-iot-servers/"
      accessories: "accessories/"
    rate_limit: 0.5
    timeout: 30
  - code: "uk"
    name: "United Kingdom"
    base_url: "https://www.asus.com/uk/"
    language: "en"
    currency: "GBP"
    category_paths:
      laptops: "laptops/"
      displays-desktops: "displays-desktops/"
      monitors: "monitors/"
      motherboards-components: "motherboards-components/"
      networking-iot-servers: "networking-iot-servers/"
      accessories: "accessories/"
    rate_limit: 0.5
    timeout: 30
  - code: "de"
    name: "Germany"
    base_url: "https://www.asus.com/de/"
    language: "de"
    currency: "EUR"
    category_paths:
      laptops: "laptops/"
      displays-desktops: "displays-desktops/"
      monitors: "monitors/"
      motherboards-components: "motherboards-components/"
      networking-iot-servers: "networking-iot-servers/"
      accessories: "accessories/"
    rate_limit: 0.5
    timeout: 30
  - code: "fr"
    name: "France"
    base_url: "https://www.asus.com/fr/"
