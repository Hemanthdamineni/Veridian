# Lenovo scraper configuration.
#
# This file is the source of truth for the Lenovo base URL and for the region
# list (category paths, rate limit, timeout). CSS selectors live in the
# scraper code because the site changes them with every build.
manufacturer: "lenovo"
brand: "Lenovo"
base_url: "https://www.lenovo.com/"
user_agent: "VeridianBot/1.0 (+https://veridian.dev; contact@veridian.dev)"
output_dir: "./output"
max_concurrent: 2
retry_attempts: 3
checkpoint_interval: 10

regions:
  - code: "us"
    name: "United States"
    base_url: "https://www.lenovo.com/us/en/"
    language: "en"
    currency: "USD"
    category_paths:
      laptops: "laptops/"
      desktops: "desktops/"
      workstations: "workstations/"
      tablets: "tablets/"
      monitors: "monitors/"
      accessories: "accessories/"
    rate_limit: 0.5
    timeout: 30
  - code: "in"
    name: "India"
    base_url: "https://www.lenovo.com/in/en/"
    language: "en"
    currency: "INR"
    category_paths:
      laptops: "laptops/"
      desktops: "desktops/"
      workstations: "workstations/"
      tablets: "tablets/"
      monitors: "monitors/"
      accessories: "accessories/"
    rate_limit: 0.5
    timeout: 30
  - code: "uk"
    name: "United Kingdom"
    base_url: "https://www.lenovo.com/gb/en/"
    language: "en"
    currency: "GBP"
    category_paths:
      laptops: "laptops/"
      desktops: "desktops/"
      workstations: "workstations/"
      tablets: "tablets/"
      monitors: "monitors/"
      accessories: "accessories/"
    rate_limit: 0.5
    timeout: 30
