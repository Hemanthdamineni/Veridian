# Lenovo scraper configuration.
#
# This file is the source of truth for the Lenovo base URL and for the region
# list (category paths, rate limit, timeout). CSS selectors live in the
# scraper code because the site changes them with every build.
manufacturer: "lenovo"
brand: "Lenovo"
base_url: "https://www.lenovo.com/"
user_agent: "VeridianBot/1.0 (+https://veridian.dev; contact@veridian.dev)"
output_dir: "./output"
max_concurrent: 2
retry_attempts: 3
checkpoint_interval: 10

regions:
  - code: "us"
    name: "United States"
    base_url: "https://www.lenovo.com/us/en/"
    language: "en"
    currency: "USD"
    category_paths:
      laptops: "/us/en/laptops/"
      desktops: "/us/en/desktops/"
      workstations: "/us/en/workstations/"
      tablets: "/us/en/tablets/"
      monitors: "/us/en/monitors/"
      accessories: "/us/en/accessories/"
    rate_limit: 0.5
    timeout: 30
  - code: "in"
    name: "India"
    base_url: "https://www.lenovo.com/in/en/"
    language: "en"
    currency: "INR"
    category_paths:
      laptops: "/in/en/laptops/"
      desktops: "/in/en/desktops/"
      workstations: "/in/en/workstations/"
      tablets: "/in/en/tablets/"
      monitors: "/in/en/monitors/"
      accessories: "/in/en/accessories/"
    rate_limit: 0.5
    timeout: 30
  - code: "uk"
    name: "United Kingdom"
    base_url: "https://www.lenovo.com/gb/en/"
    language: "en"
    currency: "GBP"
    category_paths:
      laptops: "/c/laptops/"
      desktops: "/c/desktops/"
      workstations: "/c/workstations/"
      tablets: "/c/tablets/"
      monitors: "/c/monitors/"
      accessories: "/c/accessories/"
    rate_limit: 0.5
    timeout: 30
