# HP scraper configuration.
#
# This file is the source of truth for the HP base URL and for the region
# list (category paths, rate limit, timeout). CSS selectors live in the
# scraper code because the site changes them with every build.
#
# Verified live on 2026-10-21: the India store answers with the honest
# Veridian agent, the US and GB stores accept the connection but never send a
# response, and the store's own GraphQL API is disallowed by HP's robots.txt
# and is therefore never requested.
manufacturer: "hp"
brand: "HP"
base_url: "https://www.hp.com/"
user_agent: "VeridianBot/1.0 (+https://veridian.dev; contact@veridian.dev)"
output_dir: "./output"
max_concurrent: 2
retry_attempts: 3
checkpoint_interval: 10

# The store renders the first page of every listing server-side (twelve
# products). Deeper pages use the same path with a "?page=" parameter.
max_listing_pages: 1
max_products_per_category: 12

regions:
  - code: "us"
    name: "United States"
    base_url: "https://www.hp.com/"
    language: "en"
    currency: "USD"
    category_paths:
      laptops: "/us-en/shop/listings/laptops"
      desktops: "/us-en/shop/listings/desktops"
      monitors: "/us-en/shop/listings/monitors"
      printers: "/us-en/shop/listings/printers"
      workstations: "/us-en/shop/listings/workstations"
      accessories: "/us-en/shop/listings/accessories"
    rate_limit: 0.5
    timeout: 30
  - code: "in"
    name: "India"
    base_url: "https://www.hp.com/"
    language: "en"
    currency: "INR"
    category_paths:
      laptops: "/in-en/shop/listings/laptops"
      desktops: "/in-en/shop/listings/desktops"
      monitors: "/in-en/shop/listings/monitors"
      printers: "/in-en/shop/listings/printers"
      workstations: "/in-en/shop/listings/workstations"
      accessories: "/in-en/shop/listings/accessories"
    rate_limit: 0.5
    timeout: 30
  - code: "uk"
    name: "United Kingdom"
    base_url: "https://www.hp.com/"
    language: "en"
    currency: "GBP"
    category_paths:
      laptops: "/uk-en/shop/listings/laptops"
      desktops: "/uk-en/shop/listings/desktops"
      monitors: "/uk-en/shop/listings/monitors"
      printers: "/uk-en/shop/listings/printers"
      workstations: "/uk-en/shop/listings/workstations"
      accessories: "/uk-en/shop/listings/accessories"
    rate_limit: 0.5
    timeout: 30
