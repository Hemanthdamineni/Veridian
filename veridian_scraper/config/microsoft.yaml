# Microsoft scraper configuration.
#
# This file is the source of truth for the Microsoft base URL and for the region
# list (category paths, rate limit, timeout). CSS selectors live in the
# scraper code because the site changes them with every build.
manufacturer: "microsoft"
brand: "Microsoft"
base_url: "https://www.microsoft.com/"
user_agent: "VeridianBot/1.0 (+https://veridian.dev; contact@veridian.dev)"
output_dir: "./output"
max_concurrent: 2
retry_attempts: 3
checkpoint_interval: 10

regions:
  - code: "us"
    name: "United States"
    base_url: "https://www.microsoft.com/en-us/"
    language: "en"
    currency: "USD"
    category_paths:
      surface-laptop: "/d/surface-laptop"
      surface-pro: "/d/surface-pro"
      surface-book: "/d/surface-book"
      surface-studio: "/d/surface-studio"
      surface-go: "/d/surface-go"
    rate_limit: 0.5
    timeout: 30
