# MSI scraper configuration.
#
# This file is the source of truth for the MSI base URL and for the region
# list (category paths, rate limit, timeout). CSS selectors live in the
# scraper code because the site changes them with every build.
manufacturer: "msi"
brand: "MSI"
base_url: "https://www.msi.com/"
user_agent: "VeridianBot/1.0 (+https://veridian.dev; contact@veridian.dev)"
output_dir: "./output"
max_concurrent: 2
retry_attempts: 3
checkpoint_interval: 10

regions:
  - code: "us"
    name: "United States"
    base_url: "https://www.msi.com/"
    language: "en"
    currency: "USD"
    category_paths:
      laptops: "/Laptop/"
    rate_limit: 0.5
    timeout: 30
