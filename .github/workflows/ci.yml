name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A daily sweep of the manufacturer sources, so that a source which
    # changes its markup or starts blocking us is noticed rather than
    # discovered later.
    - cron: "17 4 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veridian-web
    env:
      DATABASE_URL: "file:./dev.db"
      ADMIN_TOKEN: "ci-placeholder-token-not-used-in-tests"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veridian-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Check the PostgreSQL schema is in sync with the source of truth
        run: npm run db:schema:pg-check

      - name: Check the documented figures match the measured ones
        # Fails when a count quoted in README/ROADMAP/TODO/architecture.md no
        # longer matches the code it describes (routes, tests, schema models).
        run: npm run docs:metrics:check

  postgres:
    name: PostgreSQL (live schema, ingestion, audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veridian
          POSTGRES_PASSWORD: veridian
          POSTGRES_DB: veridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: veridian-web
    env:
      DATABASE_URL: "postgresql://veridian:veridian@localhost:5432/veridian"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veridian-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate the PostgreSQL Prisma client
        run: npx prisma generate --schema prisma/schema.postgres.prisma

      - name: Apply the schema to a live PostgreSQL database
        run: npx prisma db push --schema prisma/schema.postgres.prisma --skip-generate

      # The ingestion path is exercised against a real server, not a mock, so
      # a schema that only validates structurally cannot pass unnoticed.
      - name: Ingest the cited certification dataset
        run: npm run db:ingest:es

      - name: Load the reference dataset
        run: npm run db:seed

      - name: Populate the component graph
        run: npm run db:components

      - name: Audit the catalog
        run: npm run db:audit

      - name: Regenerate the documented figures against this live database
        # Rewrites docs/metrics.json and the four documents that quote the
        # catalog figures, then fails if the committed ones were stale.
        # A documented number that no longer matches the real catalog is the
        # same defect as a stale schema, and is caught the same way.
        run: |
          npm run docs:metrics
          git diff --exit-code -- docs/metrics.json README.md ROADMAP.md TODO.md docs/engineering/architecture.md docs/engineering/schema.md

      - name: Exercise the public API end to end
        run: npm run db:api:smoke

      - name: Assert the catalog is populated
        run: npm run db:assert

  python:
    name: Python (domain engine tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run pytest suite
        run: python -m pytest -q

  scraper-health:
    name: Scraper fleet health (scheduled)
    # A scheduled sweep that records what each manufacturer source is doing
    # right now. It is deliberately non-blocking: a manufacturer that blocks
    # us, or that has changed its markup, is a fact to record, not a build
    # to fail. The health report is the artifact.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run the fleet and record the health report
        run: |
          python run_scrapers.py --tier all --report --alert || true
        env:
          ALERT_RECIPIENT: ${{ secrets.VERIDIAN_ALERT_WEBHOOK }}

      - name: Upload the health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-health-report
          path: output/health/
          if-no-files-found: ignore
          retention-days: 30
