# ASUS Multi-Region Scraper Configuration

# Supported regions
regions:
  - code: "in"
    name: "India"
    base_url: "https://www.asus.com/in"
    language: "en"
    currency: "INR"
  - code: "us"
    name: "United States"
    base_url: "https://www.asus.com/us"
    language: "en"
    currency: "USD"
  - code: "uk"
    name: "United Kingdom"
    base_url: "https://www.asus.com/uk"
    language: "en"
    currency: "GBP"
  - code: "de"
    name: "Germany"
    base_url: "https://www.asus.com/de"
    language: "de"
    currency: "EUR"
  - code: "fr"
    name: "France"
    base_url: "https://www.asus.com/fr"
    language: "fr"
    currency: "EUR"
  - code: "jp"
    name: "Japan"
    base_url: "https://www.asus.com/jp"
    language: "ja"
    currency: "JPY"
  - code: "cn"
    name: "China"
    base_url: "https://www.asus.com.cn"
    language: "zh"
    currency: "CNY"
  - code: "tw"
    name: "Taiwan"
    base_url: "https://www.asus.com/tw"
    language: "zh-TW"
    currency: "TWD"
  - code: "au"
    name: "Australia"
    base_url: "https://www.asus.com/au"
    language: "en"
    currency: "AUD"
  - code: "sg"
    name: "Singapore"
    base_url: "https://www.asus.com/sg"
    language: "en"
    currency: "SGD"
  - code: "my"
    name: "Malaysia"
    base_url: "https://www.asus.com/my"
    language: "en"
    currency: "MYR"
  - code: "ph"
    name: "Philippines"
    base_url: "https://www.asus.com/ph"
    language: "en"
    currency: "PHP"
  - code: "th"
    name: "Thailand"
    base_url: "https://www.asus.com/th"
    language: "th"
    currency: "THB"
  - code: "vn"
    name: "Vietnam"
    base_url: "https://www.asus.com/vn"
    language: "vi"
    currency: "VND"
  - code: "id"
    name: "Indonesia"
    base_url: "https://www.asus.com/id"
    language: "id"
    currency: "IDR"

# Scraping settings
concurrency: 3
rate_limit_delay: 2.0
max_retries: 3
retry_backoff: 2.0
timeout: 30

# Headers
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Output settings
output_dir: "./output"
formats:
  - json
  - csv
checkpoint_interval: 50

# Categories to scrape per region (empty = all discovered)
categories: []

# Selectors (CSS selectors for parsing)
selectors:
  main_nav: "nav a[href*='/{region}/']"
  category_links: "a[href*='/{region}/laptops/'], a[href*='/{region}/motherboards/'], a[href*='/{region}/displays/'], a[href*='/{region}/networking/'], a[href*='/{region}/monitors/'], a[href*='/{region}/graphics-cards/'], a[href*='/{region}/components/'], a[href*='/{region}/accessories/'], a[href*='/{region}/phones/'], a[href*='/{region}/tablets/'], a[href*='/{region}/handhelds/'], a[href*='/{region}/desktops/'], a[href*='/{region}/servers/'], a[href*='/{region}/routers/'], a[href*='/{region}/workstations/']"
  product_cards: "a[href*='/{region}/'][href*='asus-']"
  pagination: ".pagination, .page-numbers, [class*='pagination']"
  next_page: "a[rel='next'], .next-page, button:contains('Next')"
  techspec_link: "a[href*='/techspec/']"
  model_name: ".LevelFourProductPageHeader__modelName__70ttK, h1.product-title, [class*='modelName']"
  spec_table: ".TechSpec__productTable__1imwW, .tech-spec-table, [class*='productTable']"
  spec_rows: ".TechSpec__rowTable__1LR9D, .spec-row, [class*='rowTable']"
  spec_title: ".TechSpec__rowTableTitle__3GLj4, .rowTableTitle, [class*='rowTableTitle']"
  variant_names: ".TechSpec__itemName__an9aU .pdName, [class*='itemName'] .pdName"
  variant_values: ".TechSpec__rowTableItems__KYWXp, [class*='rowTableItems']"

# Spec field mapping (normalize field names)
spec_fields:
  "Model": "model"
  "Color": "color"
  "Operating System": "operating_system"
  "Processor": "processor"
  "Graphics": "graphics"
  "Neural Processor": "neural_processor"
  "Display": "display"
  "Memory": "memory"
  "Storage": "storage"
  "Expansion Slots (includes used)": "expansion_slots"
  "I/O Ports": "io_ports"
  "Keyboard & Touchpad": "keyboard_touchpad"
  "Camera": "camera"
  "Audio": "audio"
  "Network and Communication": "network"
  "Battery": "battery"
  "Power Supply": "power_supply"
  "Weight": "weight"
  "Dimensions (W x D x H)": "dimensions"
  "Built-in Apps": "built_in_apps"
  "MyASUS Features": "myasus_features"
  "Exclusive Subscription Offers": "subscription_offers"
  "Microsoft Office": "microsoft_office"
  "Military Grade": "military_grade"
  "Ecolabels & Compliances": "ecolabels"
  "Security": "security"
  "Disclaimer": "disclaimer"
  "Included in the Box": "included_in_box"

# Logging
logging:
  level: "INFO"
  file: "./logs/scraper.log"
  max_bytes: 10485760
  backup_count: 5