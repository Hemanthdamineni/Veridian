# ASUS India Scraper Configuration

# Base URLs
base_url: "https://www.asus.com"
region: "in"  # India
language: "en"

# Scraping settings
concurrency: 3
rate_limit_delay: 2.0  # seconds between requests
max_retries: 3
retry_backoff: 2.0
timeout: 30

# Headers
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
accept_language: "en-IN,en;q=0.9"

# Output settings
output_dir: "./output"
formats:
  - json
  - csv
checkpoint_interval: 50  # save progress every N products

# Categories to scrape (empty = all discovered)
# categories:
#   - "laptops"
#   - "motherboards-components"
#   - "displays"
#   - "networking-iot-servers"

# Selectors (CSS selectors for parsing)
selectors:
  # Category discovery
  main_nav: "nav a[href*='/in/']"
  category_links: "a[href*='/in/laptops/'], a[href*='/in/motherboards/'], a[href*='/in/displays/'], a[href*='/in/networking/']"

  # Product listing page
  product_cards: "a[href*='/in/laptops/'][href*='asus-']"
  product_list_container: ".ProductList, .product-grid, [class*='ProductList'], [class*='product-list']"
  pagination: ".pagination, .page-numbers, [class*='pagination']"
  next_page: "a[rel='next'], .next-page, button:contains('Next')"

  # Product detail page
  techspec_link: "a[href*='/techspec/']"
  model_name: ".LevelFourProductPageHeader__modelName__70ttK, h1.product-title, [class*='modelName']"

  # Tech specs page
  spec_table: ".TechSpec__productTable__1imwW, .tech-spec-table, [class*='productTable']"
  spec_rows: ".TechSpec__rowTable__1LR9D, .spec-row, [class*='rowTable']"
  spec_title: ".TechSpec__rowTableTitle__3GLj4, .rowTableTitle, [class*='rowTableTitle']"
  spec_variants: ".TechSpec__rowTableItems__KYWXp, [class*='rowTableItems']"
  variant_name: ".TechSpec__itemName__an9aU .pdName, [class*='itemName']"
  variant_value: "p, .spec-value, [class*='spec-value']"

  # Product listing page - embedded data
  nuxt_data: "script#__NUXT_DATA__, script:contains('window.__NUXT__')"

# Spec field mapping (normalize field names)
spec_fields:
  "Model": "model"
  "Color": "color"
  "Operating System": "operating_system"
  "Processor": "processor"
  "Graphics": "graphics"
  "Neural Processor": "neural_processor"
  "Display": "display"
  "Memory": "memory"
  "Storage": "storage"
  "Expansion Slots (includes used)": "expansion_slots"
  "I/O Ports": "io_ports"
  "Keyboard & Touchpad": "keyboard_touchpad"
  "Camera": "camera"
  "Audio": "audio"
  "Network and Communication": "network"
  "Battery": "battery"
  "Power Supply": "power_supply"
  "Weight": "weight"
  "Dimensions (W x D x H)": "dimensions"
  "Built-in Apps": "built_in_apps"
  "MyASUS Features": "myasus_features"
  "Exclusive Subscription Offers": "subscription_offers"
  "Microsoft Office": "microsoft_office"
  "Military Grade": "military_grade"
  "Ecolabels & Compliances": "ecolabels"
  "Security": "security"
  "Disclaimer": "disclaimer"
  "Included in the Box": "included_in_box"

# Logging
logging:
  level: "INFO"
  file: "./logs/scraper.log"
  max_bytes: 10485760
  backup_count: 5